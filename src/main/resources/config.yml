#
#                        List of Commands
#
#               aagive <player> <artifact> <level>
#          Gives a player an artifact of specific level
#           Required permission: advancedartifacts.give
#      Example usage: /aagive WIX3Y reduce_poison_damage 10
#
#                           aainventory
#                  Opens the artifacts inventory
#      Required permission: advancedartifacts.inventory.self
#            (player have this permission by default)
#                   Example usage: /aainventory
#
#                      aainventory <player>
#       Opens the artifacts inventory for a specific player
#     Required permission: advancedartifacts.inventory.others
#                Example usage: /aainventory WIX3Y
#
#                    aainventoryother <player>
#  Allows viewing and editing another players artifact inventory
#     Note: do not edit another players artifact inventory at
#        the same time as that player is editing their own
#                       artifact inventory
#   Required permission: advancedartifacts.inventory.adminview
#             Example usage: /aainventoryother WIX3Y
#
#                            aatinker
#                      Opens the tinker gui
#       Required permission: advancedartifacts.tinker.self
#                    Example usage: /aatinker
#
#                        aatinker <player>
#             Opens the tinker gui for another player
#      Required permission: advancedartifacts.tinker.others
#                 Example usage: /aatinker WIX3Y
#
#                            aareload
#                     Reloads the config file
#          Required permission: advancedartifacts.reload
#                    Example usage: /aareload
#
#   ┗━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━┛
#

# Do not change
config-version: 1

MySQL:
  ip: localhost
  port: 3306
  database: advanced_artifacts
  username: root
  password: password
  poolsize: 10
  updatefreq: 12000 # How often to write to mysql database in ticks, set to -1 to disable

# Title in the artifact tinker menu
TinkerMenuName: "<gradient:#5544FF:#CCBBFF:#5544FF> Advanced Artifacts Tinker </gradient>"
# Title in the player artifact inventory
MenuName: "<gradient:#5544FF:#CCBBFF:#5544FF> Advanced Artifacts Inventory </gradient>"
# Number of rows in the player artifact inventory
inventoryRows: 3

# List of artifacts
#
# Additional mob specific damage dealing increase artifacts can be added using identifier:
# increase_mob_damage_<mob-type>
#
# Additional mob specific damage taken reduction artifacts can be added using identifier:
