      - "<!italic><gray>Reduces damage taken from poison effect by {desc}%"
      - ""
      - "<!italic><gray>Artifact level {level}"
      - ""
      - "<!italic><gray>Place in <yellow>/artifacts <gray>to use"
      - ""
      - "<reset><bold><blue>Artifact"
