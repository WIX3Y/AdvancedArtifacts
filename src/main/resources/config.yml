Artifacts:
  reduce_poison_damage:
    Item: SLIME_BALL # Item material
    ItemModel: none # custom item model with format namespace:key
    Name: "<!italic><gradient:#5544FF:#CCBBFF:#5544FF>Pᴏɪsᴏɴ Pʀᴏᴛᴇᴄᴛɪᴏɴ Aʀᴛɪғᴀᴄᴛ</gradient>" # display name
    Lore: # display lore with placeholders {desc} and {level} taken from the levels defined below
